server {
    listen 8080;
    server_name _;

    location = /health {
        return 200 "OK";
    }

    location  /login {
        return 302 /login/;
    }

    location = /login/ {
        root /var/www/html;
        index index.html;
    }

    location /oauth2/github/ {
        proxy_pass http://127.0.0.1:4180;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/gitlab/ {
        proxy_pass http://127.0.0.1:4181;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/keycloak/ {
        proxy_pass http://127.0.0.1:4182;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /github/auth {
        internal;

        proxy_pass http://127.0.0.1:4180/oauth2/github/auth;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location = /gitlab/auth {
        internal;

        proxy_pass http://127.0.0.1:4181/oauth2/gitlab/auth;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location = /keycloak/auth {
        internal;

        proxy_pass http://127.0.0.1:4182/oauth2/keycloak/auth;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location = /github/ {
        return 302 /oauth2/github/start?rd=$scheme://$host/;
    }

    location = /gitlab/ {
        return 302 /oauth2/gitlab/start?rd=$scheme://$host/;
    }

    location = /keycloak/ {
        return 302 /oauth2/keycloak/start?rd=$scheme://$host/;
    }

    location / {
        auth_request /github/auth;
        error_page 401 = @try_gitlab;

        proxy_pass http://webui.ecs.local:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @try_gitlab {
        auth_request /gitlab/auth;
        error_page 401 = @try_keycloak;

        proxy_pass http://webui.ecs.local:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @try_keycloak {
        auth_request /keycloak/auth;
        error_page 401 = @login;

        proxy_pass http://webui.ecs.local:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login {
        return 302 /login/;
    }
}