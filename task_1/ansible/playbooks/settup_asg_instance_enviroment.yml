- name: settup asg instance enviroment
  hosts: all
  become: true

  tasks:

  - name: get docker
    ansible.builtin.dnf:
      name: docker
      state: present

  - name: get aws cli
    ansible.builtin.dnf:
      name: awscli
      state: present

  - name: enable docker
    ansible.builtin.systemd:
      name: docker
      state: started
      enabled: true

  - name: add docker group
    ansible.builtin.user:
      name: ec2-user
      groups: docker
      append: true

  - name: log into ecr
    ansible.builtin.shell:
      cmd: >
        aws ecr get-login-password --region us-east-1 |
        docker login --username AWS --password-stdin
        {{aws_id}}.dkr.ecr.us-east-1.amazonaws.com
    register: ecr_login

  - name: pull tinyllama image
    ansible.builtin.command:
      cmd: >
        docker pull {{aws_id}}.dkr.ecr.us-east-1.amazonaws.com/practice/task_1:latest

  - name: start llama container
    ansible.builtin.command:
      cmd: >
        docker run -d --name tinyllama -p 8080:8080
        {{aws_id}}.dkr.ecr.us-east-1.amazonaws.com/practice/task_1:latest

  - name: create node exporter user
    ansible.builtin.user:
      name: node_exporter
      system: true
      shell: /sbin/nologin
      create_home: false

  - name: download node exporter
    ansible.builtin.get_url:
      url: https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-amd64.tar.gz
      dest: /tmp/node_exporter.tar.gz
      mode: "0644"

  - name: Install node exporter binary
    ansible.builtin.copy:
      src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
      dest: /usr/local/bin/node_exporter
      owner: node_exporter
      group: node_exporter
      mode: "0755"
      remote_src: true

  - name: Create node exporter service
    ansible.builtin.copy:
      src: files/node_exporter.service
      dest: /etc/systemd/system/node_exporter.service
      owner: root
      group: root
      mode: "0644"
  
  - name: Start node exporter
    ansible.builtin.systemd:
      name: node_exporter
      state: started
      enabled: true
      daemon_reload: true